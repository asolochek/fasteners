# Example Apache reverse proxy for Partstore. Replace the address, hostname and auth to suit your server.
# a2enmod proxy proxy_http auth_basic; htpasswd -c /etc/apache2/partstore.htpasswd yourname
<VirtualHost *:80>
    ServerName partstore.example.org
    ProxyPreserveHost On
    ProxyTimeout 180
    # the pages listen on /api/events (server-sent events): streaming must pass through unbuffered
    ProxyPass        /api/events http://127.0.0.1:8093/api/events flushpackets=on timeout=3600
    ProxyPass        / http://127.0.0.1:8093/
    ProxyPassReverse / http://127.0.0.1:8093/
    <Location />
        AuthType Basic
        AuthName "Partstore"
        AuthUserFile /etc/apache2/partstore.htpasswd
        # "Require forward-dns home.example.org" beside valid-user (in a RequireAny) lets a dynamic-DNS address in without a password
        Require valid-user
    </Location>
    # the print helper logs in with its token (X-Token), which the app checks, not with a password
    <Location /api/helper/>
        Require all granted
    </Location>
</VirtualHost>
# Serve it over https (certbot --apache does the rest): a password and the helper token should not cross the network in clear.
