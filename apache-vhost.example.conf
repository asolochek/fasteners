# Example Apache reverse proxy for the fastener grid. Replace the address, hostname and auth to suit your server.
# a2enmod proxy proxy_http auth_basic; htpasswd -c /etc/apache2/fasteners.htpasswd yourname
<VirtualHost *:80>
    ServerName fasteners.example.org
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8093/
    ProxyPassReverse / http://127.0.0.1:8093/
    <Location />
        AuthType Basic
        AuthName "Fasteners"
        AuthUserFile /etc/apache2/fasteners.htpasswd
        Require valid-user
    </Location>
</VirtualHost>

# The pages listen on /api/events (server-sent events). Streaming must pass through unbuffered:
#   ProxyPass /api/events http://127.0.0.1:8093/api/events flushpackets=on
# placed before the general ProxyPass line, or set "SetEnv proxy-nokeepalive 0" and rely on the 25 s pings.
