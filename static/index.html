<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fasteners</title>
<style>
:root { --paper:#f7f6f2; --ink:#17181a; --ink2:#5b6470; --line:#d9d7cf; --have:#dff3df; --have2:#8fcf8f; --none:#ebe9e3; --accent:#d8641f; }
html, body { height:100%; }
body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.35 system-ui, sans-serif; display:flex; flex-direction:column; }
header { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:18px; margin:0 12px 0 0; font-weight:600; }
.tab { padding:6px 10px; border:1px solid var(--line); background:#fff; cursor:pointer; border-radius:4px; }
.tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.spacer { flex:1; }
button { font:inherit; padding:6px 10px; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; }
button:hover { border-color:var(--ink2); }
#status { color:var(--ink2); font-size:13px; }
/* the grid is the only thing that scrolls: header and legend stay put, the length row sticks to the top and the size column to the left */
main { flex:1; min-height:0; overflow:auto; padding:0 14px 14px; }
thead th { position:sticky; top:0; background:var(--paper); z-index:3; padding-top:8px; }
th.row { position:sticky; left:0; background:var(--paper); z-index:2; }
thead th:first-child { left:0; z-index:4; }
table { border-collapse:separate; border-spacing:3px; }
th { font-weight:600; font-size:13px; color:var(--ink2); padding:2px 4px; white-space:nowrap; text-align:center; vertical-align:bottom; }
th.row { text-align:right; font-size:15px; color:var(--ink); }
th .dec { font-weight:400; color:var(--ink2); }
th .del { color:var(--ink2); cursor:pointer; margin-left:4px; font-weight:400; }
th .del:hover { color:var(--accent); }
td.cell { background:var(--none); border-radius:5px; padding:5px 6px 24px; min-width:150px; vertical-align:top; position:relative; }
td.cell.have { background:var(--have); box-shadow:inset 0 0 0 1.5px var(--have2); }
td.washer { background:var(--none); }
.icons { display:flex; gap:4px; flex-wrap:wrap; }
.ic { width:44px; height:44px; opacity:.28; cursor:pointer; border-radius:3px; }
.ic.on { opacity:1; }
.ic:hover { outline:1.5px solid var(--accent); }
.ic svg { width:100%; height:100%; display:block; }
.meta { position:absolute; left:6px; right:6px; bottom:4px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--ink2); min-height:14px; }
.drawer { cursor:pointer; padding:0 3px; border-radius:3px; }
.drawer:hover { background:#fff; }
.drawer.set { color:var(--ink); font-weight:600; }
.print { cursor:pointer; opacity:.55; }
.print:hover { opacity:1; color:var(--accent); }
td.cell:not(.have) .print { visibility:hidden; }
.legend { display:flex; gap:14px; flex-wrap:wrap; padding:8px 14px; font-size:13px; color:var(--ink2); border-bottom:1px solid var(--line); }
.legend span { display:inline-flex; align-items:center; gap:4px; }
.legend svg { width:30px; height:30px; }
#types { position:fixed; top:56px; right:14px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px 14px; box-shadow:0 4px 18px rgba(0,0,0,.12); display:none; z-index:5; max-height:80vh; overflow:auto; }
#types h3 { margin:6px 0 4px; font-size:13px; color:var(--ink2); }
#types label { display:flex; align-items:center; gap:6px; padding:2px 0; cursor:pointer; }
#types label svg { width:24px; height:24px; }
#preview { position:fixed; right:14px; bottom:14px; background:#fff; border:1px solid var(--line); padding:6px; border-radius:6px; box-shadow:0 4px 18px rgba(0,0,0,.12); display:none; }
#preview img { display:block; height:60px; }
</style>
</head>
<body>
<header>
  <h1>Fasteners</h1>
  <div id="tabs"></div>
  <span class="spacer"></span>
  <button id="typesBtn">Types…</button>
  <button id="addRow">Add row…</button>
  <button id="addLen">Add length…</button>
  <button id="printNew">PDF: unprinted</button>
  <button id="printAll">PDF: all</button>
  <button id="markPrinted">Mark all printed</button>
  <span id="status"></span>
</header>
<div class="legend" id="legend"></div>
<main>
  <div id="grid"></div>
</main>
<div id="preview"><img alt=""></div>
<div id="types"></div>
<script>
let data, icons, printed = {}, pageId, saveTimer;
const $ = s => document.querySelector(s);
function lengthText(page, len) {
  if (page.units === 'mm') return `${+len}mm`;
  const whole = Math.floor(len + 1e-9), frac = +(len - whole).toFixed(6);
  let f = '';
  if (frac) { for (const d of [2, 4, 8, 16, 32, 64]) { const n = frac * d; if (Math.abs(n - Math.round(n)) < 1e-6) { f = `${Math.round(n)}/${d}`; break; } } if (!f) f = String(frac).replace(/^0/, ''); }
  return (whole ? (f ? `${whole}-${f}` : String(whole)) : f) + '″';
}
function lengths(page) {
  const L = page.lengths, out = new Set();
  for (let x = L.start; x <= L.stop + 1e-9; x = +(x + L.step).toFixed(6)) out.add(+x.toFixed(6));
  for (const e of L.extra || []) out.add(+e);
  for (const s of L.skip || []) out.delete(+s);
  return [...out].sort((a, b) => a - b);
}
const page = () => data.pages.find(p => p.id === pageId);
function status(t) { $('#status').textContent = t; }
function save() {
  clearTimeout(saveTimer); status('saving…');
  saveTimer = setTimeout(async () => {
    const r = await fetch('/api/data', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    status(r.ok ? 'saved' : 'save failed'); if (!r.ok) alert('Save failed');
  }, 400);
}
function cell(key) { const p = page(); return p.cells[key] || (p.cells[key] = { types: [] }); }
function toggle(key, type) {
  const c = cell(key); const i = c.types.indexOf(type);
  if (i >= 0) c.types.splice(i, 1); else c.types.push(type);
  save(); render();
}
// drawer number with an optional half: "12" (undivided), "12R" / "12 rear", "12F" / "12 front"
const halfText = h => h === 'back' ? 'rear' : h === 'front' ? 'front' : '';
function setDrawer(key) {
  const c = cell(key); const v = prompt(`Drawer for ${key.replace('|', ' ')} — number, then R (rear) or F (front) if the drawer is divided, e.g. 12, 12R, 12F`, (c.drawer || '') + (c.half === 'back' ? 'R' : c.half === 'front' ? 'F' : ''));
  if (v === null) return;
  const m = /^\s*([^\s]*?)\s*(r|rear|b|back|f|front)?\s*$/i.exec(v) || [];
  c.drawer = (m[1] || '').trim(); const h = (m[2] || '').toLowerCase();
  c.half = /^(r|rear|b|back)$/.test(h) ? 'back' : /^(f|front)$/.test(h) ? 'front' : '';
  save(); render();
}
function iconEl(type, on, key) {
  const d = document.createElement('div'); d.className = 'ic' + (on ? ' on' : ''); d.title = icons.labels[type] || type;
  d.innerHTML = icons.svg[type]; d.onclick = () => toggle(key, type); return d;
}
function cellTd(key, types, extraClass = '') {
  const c = page().cells[key] || { types: [] };
  const td = document.createElement('td'); td.className = 'cell ' + extraClass + (c.types.length ? ' have' : '');
  const ic = document.createElement('div'); ic.className = 'icons';
  for (const t of types) ic.appendChild(iconEl(t, c.types.includes(t), key));
  td.appendChild(ic);
  const meta = document.createElement('div'); meta.className = 'meta';
  const dr = document.createElement('span'); dr.className = 'drawer' + (c.drawer ? ' set' : ''); dr.textContent = c.drawer ? `drawer ${c.drawer}${c.half ? ' ' + halfText(c.half) : ''}` : 'drawer?'; dr.onclick = () => setDrawer(key);
  const pr = document.createElement('span'); pr.className = 'print'; pr.textContent = '⎙'; pr.title = 'PDF for this label'; pr.onclick = () => printKeys([key]);
  pr.onmouseenter = () => showPreview(key); pr.onmouseleave = hidePreview;
  meta.appendChild(dr); meta.appendChild(pr); td.appendChild(meta);
  return td;
}
function render() {
  const p = page(), lens = lengths(p);
  $('#tabs').innerHTML = data.pages.map(x => `<span class="tab${x.id === pageId ? ' on' : ''}" data-id="${x.id}">${x.title}</span>`).join(' ');
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { pageId = t.dataset.id; render(); });
  $('#legend').innerHTML = [...p.heads, ...HW.flatMap(([list]) => p[list] || [])].map(t => `<span>${icons.svg[t]}${icons.labels[t] || t}</span>`).join('');
  const tbl = document.createElement('table');
  const thead = document.createElement('tr'); const theadEl = document.createElement('thead'); theadEl.appendChild(thead); tbl.appendChild(theadEl); const tbody = document.createElement('tbody'); tbl.appendChild(tbody);
  // inch headers show the decimal under the fraction
  const hdr = l => p.units === 'mm' ? lengthText(p, l) : `${lengthText(p, l)} <span class="dec">(${(+l).toFixed(4).replace(/0+$/, '').replace(/^0/, '')})</span>`;
  thead.innerHTML = '<th></th>' + lens.map(l => `<th>${hdr(l)}${p.lengths.extra?.includes(l) || canSkip(p, l) ? `<span class="del" data-len="${l}" title="remove this length">×</span>` : ''}</th>`).join('') + HW.filter(([list]) => (p[list] || []).length).map(([, , , title]) => `<th>${title}s</th>`).join('');
  const diaRows = {}; p.rows.forEach(r => (diaRows[r.dia] = diaRows[r.dia] || []).push(r));
  const doneDia = new Set();
  for (const r of p.rows) {
    const tr = document.createElement('tr');
    const th = document.createElement('th'); th.className = 'row'; th.textContent = r.label;
    if (rowEmpty(p, r)) { const x = document.createElement('span'); x.className = 'del'; x.textContent = '×'; x.title = 'remove this row'; x.onclick = () => removeRow(r.id); th.appendChild(x); }
    tr.appendChild(th);
    for (const l of lens) tr.appendChild(cellTd(`${r.id}|${l}`, p.heads));
    for (const [list, suffix, per] of HW) {
      if (!(p[list] || []).length) continue;
      if (per === 'row') tr.appendChild(cellTd(`${r.id}|${suffix}`, p[list]));
      else if (!doneDia.has(r.dia + suffix)) { doneDia.add(r.dia + suffix); const td = cellTd(`${r.dia}|${suffix}`, p[list], 'washer'); td.rowSpan = diaRows[r.dia].length; tr.appendChild(td); }
    }
    tbody.appendChild(tr);
  }
  $('#grid').innerHTML = ''; $('#grid').appendChild(tbl);
  if ($('#types').style.display === 'block') renderTypes();
  tbl.querySelectorAll('.del').forEach(x => x.onclick = () => removeLength(+x.dataset.len));
}
// rows: thread sizes. "#3-48", "1/4-28", "M6x0.75" (metric without a pitch gets the coarse pitch). Kept in diameter order, coarse before fine.
const COARSE = { 1.6: 0.35, 2: 0.4, 2.5: 0.45, 3: 0.5, 3.5: 0.6, 4: 0.7, 5: 0.8, 6: 1, 8: 1.25, 10: 1.5, 12: 1.75 };
function parseRow(text, units) {
  const t = text.trim().replace(/\s+/g, '');
  if (units === 'mm') { const m = /^M(\d+(?:\.\d+)?)(?:[x×](\d+(?:\.\d+)?))?$/i.exec(t); if (!m) return null;
    const d = +m[1], pitch = m[2] ? +m[2] : COARSE[d]; if (!pitch) return null;
    const label = `M${d}${m[2] ? '×' + pitch : ''}`; return { id: label.replace('×', 'x'), label, dia: `M${d}`, pitch }; }
  const m = /^#?(\d+|\d+\/\d+)(?:-(\d+))?$/.exec(t); if (!m) return null;
  const dia = m[1].includes('/') ? m[1] : `#${m[1]}`;
  if (!m[2]) return { id: dia, label: dia, dia, pitch: 0 };   // gauge only (wood / sheet metal screws)
  const label = `${dia}-${m[2]}`; return { id: `${m[1]}-${m[2]}`, label, dia, pitch: +m[2] };
}
function diaValue(dia) { if (dia.startsWith('#')) return 0.06 + 0.013 * +dia.slice(1); if (dia.startsWith('M')) return +dia.slice(1) / 25.4; const [n, d] = dia.split('/'); return d ? n / d : +dia; }
function rowKey(p, r) { return [diaValue(r.dia), p.units === 'mm' ? -r.pitch : r.pitch]; }   // metric: larger pitch (coarse) first; SAE: fewer threads (coarse) first
function sortRows(p) { p.rows.sort((a, b) => { const [ka, pa] = rowKey(p, a), [kb, pb] = rowKey(p, b); return (ka - kb) || (pa - pb); }); }
function rowEmpty(p, r) { return !Object.keys(p.cells).some(k => k.startsWith(r.id + '|') && (p.cells[k].types || []).length); }
$('#addRow').onclick = () => {
  const p = page(); const v = prompt(p.units === 'mm' ? 'Thread size, e.g. M6 or M6x0.75' : 'Thread size, e.g. #3-48 or 1/4-28 (gauge only, e.g. #6, for wood and sheet metal screws)'); if (!v) return;
  const r = parseRow(v, p.units); if (!r) return alert('Could not read that as a thread size');
  if (p.rows.some(x => x.id === r.id)) return alert('That row already exists');
  p.rows.push(r); sortRows(p); save(); render();
};
function removeRow(id) {
  const p = page(), r = p.rows.find(x => x.id === id);
  if (!rowEmpty(p, r)) return alert('That row still has parts ticked.');
  p.rows = p.rows.filter(x => x.id !== id); save(); render();
}
function canSkip(p, l) { return !p.rows.some(r => (p.cells[`${r.id}|${l}`]?.types || []).length); }
function removeLength(l) {
  const p = page();
  if (!canSkip(p, l)) return alert('That length still has screws ticked.');
  if (p.lengths.extra?.includes(l)) p.lengths.extra = p.lengths.extra.filter(x => x !== l); else (p.lengths.skip = p.lengths.skip || []).push(l);
  save(); render();
}
// a length typed as a decimal, a fraction or a mixed number: 0.4375, 7/16, 1-1/2, 1 1/2, 22
function parseLength(text) {
  const t = text.trim().replace(/[″"]/g, '').replace(/mm$/i, '').trim();
  const m = /^(\d+)?(?:[\s-]*(\d+)\/(\d+))?$/.exec(t);
  if (m && (m[1] || m[2])) return (+(m[1] || 0)) + (m[2] ? +m[2] / +m[3] : 0);
  const n = +t; return n > 0 ? n : NaN;
}
$('#addLen').onclick = () => {
  const p = page(); const v = prompt(`Length to add (${p.units === 'mm' ? 'mm, e.g. 22' : 'e.g. 7/16, 0.4375 or 1-1/2'})`); if (!v) return;
  const n = +parseLength(v).toFixed(6); if (!(n > 0)) return alert('Could not read that as a length');
  p.lengths.skip = (p.lengths.skip || []).filter(x => x !== n);
  if (!lengths(p).includes(n)) (p.lengths.extra = p.lengths.extra || []).push(n);
  save(); render();
};
async function printKeys(keys) {
  status('rendering…');
  const r = await fetch('/api/labels', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ page: pageId, keys }) });
  if (!r.ok) { status(''); return alert((await r.json()).error || 'failed'); }
  const n = r.headers.get('X-Label-Count'); const blob = await r.blob(); window.open(URL.createObjectURL(blob), '_blank'); status(`${n} label${n == 1 ? '' : 's'} rendered`);
}
// which head / nut / washer types this page shows (types ticked in cells but hidden here still print)
// hardware columns: [page list, cell key suffix, per row or per diameter, label]
const HW = [['nuts', 'nut', 'row', 'Nut'], ['locknuts', 'locknut', 'row', 'Lock Nut'], ['washers', 'washer', 'dia', 'Washer'], ['lockwashers', 'lockwasher', 'dia', 'Lock Washer']];
const GROUPS = [['heads', 'Heads', ['flat', 'pan', 'socket', 'button', 'truss', 'hex', 'sems', 'shoulder', 'nylon', 'setscrew', 'wood', 'sheetmetal', 'buttonsm', 'trusssm', 'hexsm']], ['nuts', 'Nuts', ['nut', 'thin', 'pressfit', 'wing']], ['locknuts', 'Lock nuts', ['nylock', 'toothednut', 'lock']], ['washers', 'Washers', ['washer', 'fender', 'thinw', 'cup', 'sleeved', 'nylonw']], ['lockwashers', 'Lock washers', ['split', 'spring', 'inttooth', 'toothed']]];
function renderTypes() {
  const p = page();
  $('#types').innerHTML = GROUPS.map(([k, title, all]) => `<h3>${title}</h3>` + all.map(t => `<label><input type="checkbox" data-group="${k}" data-type="${t}" ${p[k].includes(t) ? 'checked' : ''}>${icons.svg[t]}${icons.labels[t] || t}</label>`).join('')).join('');
  $('#types').querySelectorAll('input').forEach(i => i.onchange = () => {
    p[i.dataset.group] = p[i.dataset.group] || []; const list = p[i.dataset.group], t = i.dataset.type;
    if (i.checked) { if (!list.includes(t)) list.push(t); list.sort((a, b) => GROUPS.find(g => g[0] === i.dataset.group)[2].indexOf(a) - GROUPS.find(g => g[0] === i.dataset.group)[2].indexOf(b)); }
    else p[i.dataset.group] = list.filter(x => x !== t);
    save(); render();
  });
}
$('#typesBtn').onclick = () => { const t = $('#types'); if (t.style.display === 'block') t.style.display = 'none'; else { renderTypes(); t.style.display = 'block'; } };
$('#printAll').onclick = () => printKeys('all');
$('#printNew').onclick = () => printKeys('new');
$('#markPrinted').onclick = async () => {
  if (!confirm('Record every populated cell on this page as printed with its current text?')) return;
  const r = await fetch('/api/printed', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ page: pageId, keys: 'all' }) });
  status(r.ok ? `${(await r.json()).marked} marked printed` : 'failed');
};
function showPreview(key) { const img = $('#preview img'); img.src = `/api/preview.png?page=${encodeURIComponent(pageId)}&key=${encodeURIComponent(key)}&t=${Date.now()}`; $('#preview').style.display = 'block'; }
function hidePreview() { $('#preview').style.display = 'none'; }
(async () => {
  [data, icons] = await Promise.all([fetch('/api/data').then(r => r.json()), fetch('/api/icons').then(r => r.json())]);
  pageId = data.pages[0].id; render(); status('loaded');
})();
</script>
</body>
</html>
