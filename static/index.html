<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fasteners</title>
<style>
:root { --paper:#f7f6f2; --ink:#17181a; --ink2:#5b6470; --line:#d9d7cf; --have:#dff3df; --have2:#8fcf8f; --none:#ebe9e3; --accent:#d8641f; }
html, body { height:100%; }
body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.35 system-ui, sans-serif; display:flex; flex-direction:column; }
header { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:18px; margin:0 12px 0 0; font-weight:600; }
.tab { padding:6px 10px; border:1px solid var(--line); background:#fff; cursor:pointer; border-radius:4px; }
.tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.spacer { flex:1; }
button { font:inherit; padding:6px 10px; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; }
button:hover { border-color:var(--ink2); }
#status { color:var(--ink2); font-size:13px; }
/* the grid is the only thing that scrolls: header and legend stay put, the length row sticks to the top and the size column to the left */
main { flex:1; min-height:0; overflow:auto; padding:0 14px 14px; }
thead th { position:sticky; top:0; background:var(--paper); z-index:3; padding-top:8px; }
th.row { position:sticky; left:0; background:var(--paper); z-index:2; vertical-align:middle; padding-right:24px; }
th.row .rowctl { position:absolute; right:3px; bottom:3px; margin:0; padding:0 4px; border:0; background:transparent; font:inherit; line-height:1; z-index:3; cursor:pointer; }
thead th:first-child { left:0; z-index:4; }
table { border-collapse:separate; border-spacing:3px; }
th { font-weight:600; font-size:13px; color:var(--ink2); padding:2px 4px; white-space:nowrap; text-align:center; vertical-align:bottom; }
th.row { text-align:right; font-size:15px; color:var(--ink); }
th .dec { font-weight:400; color:var(--ink2); }
th .del { color:var(--ink2); cursor:pointer; margin-left:4px; font-weight:400; }
th .del:hover { color:var(--accent); }
td.cell { background:var(--none); border-radius:5px; padding:5px 6px 24px; min-width:150px; vertical-align:top; position:relative; }
td.cell.have { background:var(--have); box-shadow:inset 0 0 0 1.5px var(--have2); }
td.washer { background:var(--none); }
.icons { display:flex; gap:4px; flex-wrap:wrap; }
.icons.dense .ic { width:32px; height:32px; }
.ic { position:relative; }
.ic .badge { position:absolute; right:-3px; bottom:-3px; background:var(--accent); color:#fff; font-size:9px; line-height:1; padding:2px 3px; border-radius:6px; font-weight:600; pointer-events:none; }
.ic.hasinfo::after { content:''; position:absolute; left:2px; top:2px; width:6px; height:6px; border-radius:3px; background:var(--ink2); }
.more { width:28px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--ink2); cursor:pointer; border-radius:3px; font-weight:600; }
.more:hover { background:#fff; color:var(--ink); }
#pop { position:fixed; background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px 12px; box-shadow:0 6px 24px rgba(0,0,0,.16); display:none; z-index:20; max-height:80vh; overflow:auto; width:300px; font-size:14px; }
#pop h3 { margin:0 0 6px; font-size:14px; }
#pop h4 { margin:8px 0 3px; font-size:12px; color:var(--ink2); text-transform:uppercase; letter-spacing:.04em; }
#pop label { display:flex; align-items:center; gap:6px; padding:2px 0; cursor:pointer; }
#pop label svg { width:24px; height:24px; }
#pop .sub { margin-left:22px; }
#pop input[type=text] { width:100%; box-sizing:border-box; font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:4px; }
#pop .row { display:flex; gap:8px; margin-top:10px; }
#pop .note { font-size:12px; color:var(--ink2); }
.ic { width:44px; height:44px; opacity:.28; cursor:pointer; border-radius:3px; }
.ic.on { opacity:1; }
.ic:hover { outline:1.5px solid var(--accent); }
.ic svg { width:100%; height:100%; display:block; }
.meta { position:absolute; left:6px; right:6px; bottom:4px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--ink2); min-height:14px; }
.drawer { cursor:pointer; padding:0 3px; border-radius:3px; }
.drawer:hover { background:#fff; }
.drawer.set { color:var(--ink); font-weight:600; }
.print { cursor:pointer; opacity:.55; }
.rowprint { margin-left:6px; font-weight:400; }
.print:hover { opacity:1; color:var(--accent); }
td.cell:not(.have) .print, .card:not(.have) .print { visibility:hidden; }
.legend { display:flex; gap:14px; flex-wrap:wrap; padding:8px 14px; font-size:13px; color:var(--ink2); border-bottom:1px solid var(--line); }
.legend span { display:inline-flex; align-items:center; gap:4px; }
.legend svg { width:30px; height:30px; }
#types { position:fixed; top:56px; right:14px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px 14px; box-shadow:0 4px 18px rgba(0,0,0,.12); display:none; z-index:5; max-height:80vh; overflow:auto; }
#types h3 { margin:6px 0 4px; font-size:13px; color:var(--ink2); }
#helper { position:fixed; top:56px; right:14px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px 14px; box-shadow:0 4px 18px rgba(0,0,0,.12); display:none; z-index:5; width:340px; font-size:14px; }
#helper label { display:block; margin:6px 0 2px; color:var(--ink2); font-size:12px; }
#helper input, #helper select { width:100%; box-sizing:border-box; font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:4px; }
#helper .row { display:flex; gap:8px; margin-top:10px; align-items:center; }
#helper .msg { font-size:12px; color:var(--ink2); margin-top:6px; min-height:16px; }
#types label { display:flex; align-items:center; gap:6px; padding:2px 0; cursor:pointer; }
#types label svg { width:24px; height:24px; }
/* phone layout: one thread size at a time, as a vertical list of cards */
.mobile header { padding:8px 10px; gap:6px; }
.mobile header h1 { display:none; }
.mobile #tabs { display:none; }
.mobile #pageSel { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:#fff; max-width:48vw; }
.mobile .legend { display:none; }
.mobile main { padding:8px 10px 60px; }
.mrow { display:flex; gap:8px; align-items:center; margin:4px 0 10px; }
.mrow select { flex:1; font:inherit; font-size:17px; padding:8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
.mrow button { padding:8px 10px; }
.card { background:var(--none); border-radius:8px; padding:8px 10px 6px; margin:0 0 8px; }
.card.have { background:var(--have); box-shadow:inset 0 0 0 1.5px var(--have2); }
.card .ttl { font-weight:600; margin-bottom:6px; display:flex; justify-content:space-between; align-items:baseline; }
.card .ttl .dec { font-weight:400; color:var(--ink2); font-size:13px; }
.card .icons { gap:6px; }
.card .ic { width:48px; height:48px; }
.card .meta { position:static; margin-top:6px; font-size:13px; }
.mobile #types, .mobile #helper { top:8px; right:8px; left:8px; width:auto; max-height:85vh; }
#pageSel { display:none; }
.mobile #addLen, .mobile #addRow { display:none; }
#preview { position:fixed; right:14px; bottom:14px; background:#fff; border:1px solid var(--line); padding:6px; border-radius:6px; box-shadow:0 4px 18px rgba(0,0,0,.12); display:none; }
#preview img { display:block; height:60px; }
</style>
</head>
<body>
<header>
  <h1>Fasteners</h1>
  <div id="tabs"></div>
  <select id="pageSel"></select>
  <span class="spacer"></span>
  <button id="typesBtn">Types…</button>
  <button id="addRow">Add row…</button>
  <button id="addLen">Add length…</button>
  <button id="printDrawers">PDF: drawers…</button>
  <button id="printNew">PDF: unprinted</button>
  <button id="printAll">PDF: all</button>
  <button id="markPrinted">Mark all printed</button>
  <button id="helperBtn" title="print helper on the PC with the label printer">Printer…</button>
  <button type="button" id="cabinetBtn" title="drawer map for this page">Cabinet</button>
  <span id="status"></span>
</header>
<div class="legend" id="legend"></div>
<main>
  <div id="grid"></div>
</main>
<div id="preview"><img alt=""></div>
<div id="types"></div>
<div id="helper"></div>
<div id="pop"></div>
<script>
let data, icons, printed = {}, pageId, saveTimer;
const $ = s => document.querySelector(s);
function lengthText(page, len) {
  if (page.units === 'mm') return `${+len}mm`;
  const whole = Math.floor(len + 1e-9), frac = +(len - whole).toFixed(6);
  let f = '';
  if (frac) { for (const d of [2, 4, 8, 16, 32, 64]) { const n = frac * d; if (Math.abs(n - Math.round(n)) < 1e-6) { f = `${Math.round(n)}/${d}`; break; } } if (!f) f = String(frac).replace(/^0/, ''); }
  return (whole ? (f ? `${whole}-${f}` : String(whole)) : f) + '″';
}
function lengths(page) {
  const L = page.lengths, out = new Set();
  for (let x = L.start; x <= L.stop + 1e-9; x = +(x + L.step).toFixed(6)) out.add(+x.toFixed(6));
  for (const e of L.extra || []) out.add(+e);
  for (const s of L.skip || []) out.delete(+s);
  return [...out].sort((a, b) => a - b);
}
const page = () => data.pages.find(p => p.id === pageId);
function status(t) { $('#status').textContent = t; }
function save() {
  clearTimeout(saveTimer); status('saving…');
  saveTimer = setTimeout(async () => {
    const r = await fetch('/api/data', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    if (r.status === 409) { data = (await r.json()).data; render(); status('reloaded'); alert('The data had changed on the server (another tab, or an update). Reloaded it — please redo your last change.'); return; }
    if (r.ok) { data.rev = (await r.json()).rev; status('saved'); } else { status('save failed'); alert('Save failed'); }
  }, 400);
}
function cell(key) { const p = page(); return p.cells[key] || (p.cells[key] = { types: [] }); }
function toggle(key, type) {
  const c = cell(key); const i = c.types.indexOf(type);
  if (i >= 0) c.types.splice(i, 1); else c.types.push(type);
  save(); render();
}
// drawer number with an optional half: "12" (undivided), "12R" / "12 rear", "12F" / "12 front"
const halfText = h => h === 'back' ? 'rear' : h === 'front' ? 'front' : '';
function setDrawer(key) {
  const c = cell(key); const v = prompt(`Drawer for ${key.replace('|', ' ')} — number, then R (rear) or F (front) if the drawer is divided, e.g. 12, 12R, 12F`, (c.drawer || '') + (c.half === 'back' ? 'R' : c.half === 'front' ? 'F' : ''));
  if (v === null) return;
  const m = /^\s*([^\s]*?)\s*(r|rear|b|back|f|front)?\s*$/i.exec(v) || [];
  c.drawer = (m[1] || '').trim(); const h = (m[2] || '').toLowerCase();
  c.half = /^(r|rear|b|back)$/.test(h) ? 'back' : /^(f|front)$/.test(h) ? 'front' : '';
  save(); render();
}
function iconEl(type, on, key) {
  const c = page().cells[key] || {}, info = (c.detail || {})[type] || {};
  const d = document.createElement('div'); d.className = 'ic' + (on ? ' on' : '') + (on && (info.drives || info.materials) ? ' hasinfo' : ''); d.title = (icons.labels[type] || type) + (on ? ' — right-click / long-press for drive, material, own drawer' : '');
  d.innerHTML = icons.svg[type]; d.onclick = () => toggle(key, type);
  if (on && info.drawer) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = info.drawer + (info.half === 'back' ? 'R' : info.half === 'front' ? 'F' : ''); d.appendChild(b); }
  d.oncontextmenu = e => { e.preventDefault(); if (on) openDetail(key, type, e.clientX, e.clientY); };
  return d;
}
function shownTypes(c, types, universe) {   // the column's own types plus any others ticked in this cell, in vocabulary order
  const extra = (c.types || []).filter(t => !types.includes(t) && universe.includes(t));
  return [...types, ...universe.filter(t => extra.includes(t))];
}
function cellTd(key, types, extraClass = '', universe = null) {
  const c = page().cells[key] || { types: [] };
  const td = document.createElement('td'); td.className = 'cell ' + extraClass + (c.types.length ? ' have' : '');
  const shown = universe ? shownTypes(c, types, universe) : types;
  const ic = document.createElement('div'); ic.className = 'icons' + (shown.length + (universe ? 1 : 0) > 9 ? ' dense' : '');
  for (const t of shown) ic.appendChild(iconEl(t, c.types.includes(t), key));
  if (universe && universe.some(t => !shown.includes(t))) { const m = document.createElement('div'); m.className = 'more'; m.textContent = '…'; m.title = 'other head types'; m.onclick = e => openMore(key, universe, e.clientX, e.clientY); ic.appendChild(m); }
  td.appendChild(ic);
  const meta = document.createElement('div'); meta.className = 'meta';
  const dr = document.createElement('span'); dr.className = 'drawer' + (c.drawer ? ' set' : ''); dr.textContent = c.drawer ? `drawer ${c.drawer}${c.half ? ' ' + halfText(c.half) : ''}` : 'drawer?'; dr.onclick = () => setDrawer(key);
  const pr = document.createElement('span'); pr.className = 'print'; pr.textContent = '⎙'; pr.title = 'PDF for this label'; pr.onclick = e => printCell(key, e.clientX, e.clientY);
  pr.onmouseenter = () => showPreview(key); pr.onmouseleave = hidePreview;
  meta.appendChild(dr); meta.appendChild(pr); td.appendChild(meta);
  return td;
}
const isMobile = () => window.matchMedia('(max-width: 720px)').matches;
let mobileRow = null;
window.addEventListener('resize', () => { if (data) render(); });
function render() {
  const p = page(), lens = lengths(p);
  document.body.classList.toggle('mobile', isMobile());
  $('#tabs').innerHTML = data.pages.map(x => `<span class="tab${x.id === pageId ? ' on' : ''}" data-id="${x.id}">${x.title}</span>`).join(' ');
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { pageId = t.dataset.id; render(); });
  $('#pageSel').innerHTML = data.pages.map(x => `<option value="${x.id}" ${x.id === pageId ? 'selected' : ''}>${x.title}</option>`).join('');
  $('#pageSel').onchange = e => { pageId = e.target.value; mobileRow = null; render(); };
  $('#pageSel').style.display = isMobile() ? 'block' : 'none';
  if (isMobile()) return renderMobile(p, lens);
  $('#legend').innerHTML = [...p.heads, ...HW.flatMap(([list]) => p[list] || [])].map(t => `<span>${icons.svg[t]}${icons.labels[t] || t}</span>`).join('');
  const tbl = document.createElement('table');
  const thead = document.createElement('tr'); const theadEl = document.createElement('thead'); theadEl.appendChild(thead); tbl.appendChild(theadEl); const tbody = document.createElement('tbody'); tbl.appendChild(tbody);
  // inch headers show the decimal under the fraction
  const hdr = l => p.units === 'mm' ? lengthText(p, l) : `${lengthText(p, l)} <span class="dec">(${(+l).toFixed(4).replace(/0+$/, '').replace(/^0/, '')})</span>`;
  thead.innerHTML = '<th></th>' + lens.map(l => `<th>${hdr(l)}${p.lengths.extra?.includes(l) || canSkip(p, l) ? `<span class="del" data-len="${l}" title="remove this length">×</span>` : ''}</th>`).join('') + HW.filter(([list]) => (p[list] || []).length).map(([, , , title]) => `<th>${title}s</th>`).join('');
  const diaRows = {}; p.rows.forEach(r => (diaRows[r.dia] = diaRows[r.dia] || []).push(r));
  const doneDia = new Set();
  for (const r of p.rows) {
    const tr = document.createElement('tr');
    const th = document.createElement('th'); th.className = 'row'; th.textContent = r.label;
    const ctl = document.createElement('button'); ctl.type = 'button'; ctl.dataset.row = r.id;
    if (rowEmpty(p, r)) { ctl.className = 'del rowctl'; ctl.textContent = '×'; ctl.title = 'remove this row'; ctl.dataset.act = 'remove'; }
    else { ctl.className = 'print rowprint rowctl'; ctl.textContent = '⎙'; ctl.title = 'PDF for everything in this row (and its washers)'; ctl.dataset.act = 'print'; }
    th.appendChild(ctl);
    tr.appendChild(th);
    for (const l of lens) tr.appendChild(cellTd(`${r.id}|${l}`, p.heads, '', HEAD_UNIVERSE[p.class] || HEAD_UNIVERSE.machine));
    for (const [list, suffix, per] of HW) {
      if (!(p[list] || []).length) continue;
      if (per === 'row') tr.appendChild(cellTd(`${r.id}|${suffix}`, p[list]));
      else if (!doneDia.has(r.dia + suffix)) { doneDia.add(r.dia + suffix); const td = cellTd(`${r.dia}|${suffix}`, p[list], 'washer'); td.rowSpan = diaRows[r.dia].length; tr.appendChild(td); }
    }
    tbody.appendChild(tr);
  }
  $('#grid').innerHTML = ''; $('#grid').appendChild(tbl);
  tbl.addEventListener('click', e => {
    const b = e.target.closest('.rowctl'); if (!b) return;
    const r = page().rows.find(x => x.id === b.dataset.row); if (!r) return;
    if (b.dataset.act === 'remove') removeRow(r.id); else printKeys(rowKeys(page(), r));
  });
  if ($('#types').style.display === 'block') renderTypes();
  tbl.querySelectorAll('.del').forEach(x => x.onclick = () => removeLength(+x.dataset.len));
}
// rows: thread sizes. "#3-48", "1/4-28", "M6x0.75" (metric without a pitch gets the coarse pitch). Kept in diameter order, coarse before fine.
const COARSE = { 1.6: 0.35, 2: 0.4, 2.5: 0.45, 3: 0.5, 3.5: 0.6, 4: 0.7, 5: 0.8, 6: 1, 8: 1.25, 10: 1.5, 12: 1.75 };
function parseRow(text, units) {
  const t = text.trim().replace(/\s+/g, '');
  if (units === 'mm') { const m = /^M(\d+(?:\.\d+)?)(?:[x×](\d+(?:\.\d+)?))?$/i.exec(t); if (!m) return null;
    const d = +m[1], pitch = m[2] ? +m[2] : COARSE[d]; if (!pitch) return null;
    const label = `M${d}${m[2] ? '×' + pitch : ''}`; return { id: label.replace('×', 'x'), label, dia: `M${d}`, pitch }; }
  const m = /^#?(\d+|\d+\/\d+)(?:-(\d+))?$/.exec(t); if (!m) return null;
  const dia = m[1].includes('/') ? m[1] : `#${m[1]}`;
  if (!m[2]) return { id: dia, label: dia, dia, pitch: 0 };   // gauge only (wood / sheet metal screws)
  const label = `${dia}-${m[2]}`; return { id: `${m[1]}-${m[2]}`, label, dia, pitch: +m[2] };
}
function diaValue(dia) {   // major diameter in inches, for ordering
  if (dia.startsWith('#')) { const t = dia.slice(1); if (/^0+$/.test(t)) return 0.06 - 0.013 * (t.length - 1); return 0.06 + 0.013 * +t; }   // #0 = .060, #00 = .047, #000 = .034
  if (dia.startsWith('M')) return +dia.slice(1) / 25.4; const [n, d] = dia.split('/'); return d ? n / d : +dia;
}
function rowKey(p, r) { return [diaValue(r.dia), p.units === 'mm' ? -r.pitch : r.pitch]; }   // metric: larger pitch (coarse) first; SAE: fewer threads (coarse) first
function sortRows(p) { p.rows.sort((a, b) => { const [ka, pa] = rowKey(p, a), [kb, pb] = rowKey(p, b); return (ka - kb) || (pa - pb); }); }
function rowKeys(p, r) {   // reading order within the row: lengths, then lock nut, nut, lock washer, washer (the server puts drawers first)
  const has = k => (p.cells[k]?.types || []).length;
  return [...lengths(p).map(l => `${r.id}|${l}`), ...HW.map(([, suffix, per]) => `${per === 'row' ? r.id : r.dia}|${suffix}`)].filter(has);
}
function rowEmpty(p, r) { return !Object.keys(p.cells).some(k => k.startsWith(r.id + '|') && (p.cells[k].types || []).length); }
$('#addRow').onclick = () => {
  const p = page(); const v = prompt(p.units === 'mm' ? 'Thread size, e.g. M6 or M6x0.75' : 'Thread size, e.g. #3-48 or 1/4-28 (gauge only, e.g. #6, for wood and sheet metal screws)'); if (!v) return;
  const r = parseRow(v, p.units); if (!r) return alert('Could not read that as a thread size');
  if (p.rows.some(x => x.id === r.id)) return alert('That row already exists');
  p.rows.push(r); sortRows(p); save(); render();
};
function removeRow(id) {
  const p = page(), r = p.rows.find(x => x.id === id);
  if (!rowEmpty(p, r)) return alert('That row still has parts ticked.');
  p.rows = p.rows.filter(x => x.id !== id); save(); render();
}
// phone: pick a thread size, then every cell of that row as a card (lengths, lock nut, nut, then the diameter's washers)
function renderMobile(p, lens) {
  if (!mobileRow || !p.rows.some(r => r.id === mobileRow)) mobileRow = p.rows[0]?.id;
  const r = p.rows.find(x => x.id === mobileRow);
  const g = $('#grid'); g.innerHTML = '';
  const bar = document.createElement('div'); bar.className = 'mrow';
  const sel = document.createElement('select'); sel.innerHTML = p.rows.map(x => `<option value="${x.id}" ${x.id === mobileRow ? 'selected' : ''}>${x.label}</option>`).join('');
  sel.onchange = e => { mobileRow = e.target.value; render(); };
  const pb = document.createElement('button'); pb.textContent = '⎙ row'; pb.title = 'labels for this row'; pb.onclick = () => r && printKeys(rowKeys(p, r));
  bar.appendChild(sel); bar.appendChild(pb); g.appendChild(bar);
  if (!r) return;
  const cards = [];
  for (const l of lens) cards.push([`${r.id}|${l}`, p.heads, lengthText(p, l), p.units === 'mm' ? '' : `(${(+l).toFixed(4).replace(/0+$/, '').replace(/^0/, '')})`, HEAD_UNIVERSE[p.class] || HEAD_UNIVERSE.machine]);
  for (const [list, suffix, per, title] of HW) { if (!(p[list] || []).length) continue; cards.push([`${per === 'row' ? r.id : r.dia}|${suffix}`, p[list], per === 'row' ? title : `${r.dia} ${title}`, per === 'dia' ? 'shared by this diameter' : '']); }
  for (const [key, types, title, sub, universe] of cards) {
    const c = p.cells[key] || { types: [] };
    const card = document.createElement('div'); card.className = 'card' + (c.types.length ? ' have' : '');
    const t = document.createElement('div'); t.className = 'ttl'; t.innerHTML = `<span>${title}</span><span class="dec">${sub}</span>`; card.appendChild(t);
    const ic = document.createElement('div'); ic.className = 'icons';
    const shown = universe ? shownTypes(c, types, universe) : types;

function canSkip(p, l) { return !p.rows.some(r => (p.cells[`${r.id}|${l}`]?.types || []).length); }
function removeLength(l) {

// a length typed as a decimal, a fraction or a mixed number: 0.4375, 7/16, 1-1/2, 1 1/2, 22
function parseLength(text) {

$('#addLen').onclick = () => {
  const p = page(); const v = prompt(`Length to add (${p.units === 'mm' ? 'mm, e.g. 22' : 'e.g. 7/16, 0.4375 or 1-1/2'})`); if (!v) return;

};
// print helper (helper/print-helper.py on the PC with the printer): settings live in this browser
const HS = { get() { try { return JSON.parse(localStorage.getItem('helper') || '{}'); } catch (e) { return {}; } }, set(v) { try { localStorage.setItem('helper', JSON.stringify(v)); } catch (e) {} } };

    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/pdf' }, body: blob });
    const j = await r.json();
    if (!r.ok) { alert('Print helper: ' + (j.error || r.status)); status('print failed'); return true; }

}
// the drawer halves a cell's ticked types live in (per-head overrides included): [{ slot, label, types }]
function cellSlots(key) {

    const slot = drawer ? `${drawer}|${half}` : ''; (by[slot] = by[slot] || { slot, label: drawer ? `drawer ${drawer}${half ? ' ' + halfText(half) : ''}` : 'no drawer', types: [] }).types.push(t);

function printCell(key, x, y) {

    slots.map((s, i) => `<label><input type="checkbox" data-i="${i}" checked>${s.label} <span class="note">(${s.types.map(t => icons.labels[t] || t).join(', ')})</span></label>`).join('') +
    `<div class="row"><button type="button" id="popGo">Print</button><button type="button" id="popClose">Cancel</button></div>`;
  $('#popGo').onclick = () => { const chosen = [...$('#pop').querySelectorAll('input:checked')].map(i => slots[+i.dataset.i].slot); closePop(); if (chosen.length) printKeys(null, { page: pageId, keys: [key], slots: chosen }); };

async function printKeys(keys, body) {
  status('rendering…');
  const r = await fetch('/api/labels', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || { page: pageId, keys }) });
  if (!r.ok) { status(''); return alert((await r.json()).error || 'failed'); }

// head types a class can have at all; a cell shows the page's primary list plus whatever else is ticked, and "…" offers the rest
const HEAD_UNIVERSE = { machine: ['flat', 'oval', 'pan', 'button', 'truss', 'socket', 'hex', 'flange', 'thumb', 'carriage', 'sems', 'shoulder', 'setscrew'],
                        tapping: ['wood', 'sheetmetal', 'buttonsm', 'trusssm', 'hexsm', 'flangesm', 'trim'], wood: ['wood', 'trim', 'flangesm', 'sheetmetal', 'buttonsm', 'trusssm'] };

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
function openMore(key, universe, x, y) {

function cellTextClient(p, key) { const [a, b] = key.split('|'); const hw = HW.find(h => h[1] === b); if (hw && hw[2] === 'dia') return `${a} ${hw[3]}`; const r = p.rows.find(x => x.id === a); if (!r) return key; if (hw) return `${r.label} ${hw[3]}`; return `${r.label} × ${lengthText(p, +b)}`; }
// per-head detail: own drawer, drive types, materials per drive (washers and nuts: materials only)

  } else if (isHead && fixed === 'none') h += `<h4>Drive</h4><div class="note">none</div>` + `<h4>Materials</h4>` + matList('');
  else h += `<h4>Materials</h4>` + matList('');

$('#typesBtn').onclick = () => { const t = $('#types'); if (t.style.display === 'block') t.style.display = 'none'; else { renderTypes(); t.style.display = 'block'; } };
function renderHelper() {
