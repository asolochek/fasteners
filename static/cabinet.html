<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fastener Cabinet</title>
<style>
:root { --paper:#f7f6f2; --ink:#17181a; --ink2:#5b6470; --line:#d9d7cf; --none:#e6e4de; --have:#ffffff; --bad:#f8d7d7; --bad2:#c0392b; --accent:#d8641f; }
body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.3 system-ui, sans-serif; }
header { display:flex; gap:12px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); }
h1 { font-size:18px; margin:0; font-weight:600; }
#pageSel { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:4px; background:#fff; }
.legend { color:var(--ink2); font-size:13px; display:flex; gap:14px; }
.legend i { display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:4px; border:1px solid var(--line); }
main { padding:14px; }
.grid { display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; max-width:1400px; }
.drawer { background:var(--none); border-radius:6px; min-height:74px; padding:6px 8px; position:relative; color:var(--ink2); }
.drawer.have { background:var(--have); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
.drawer.gap { background:var(--bad); box-shadow:inset 0 0 0 2px var(--bad2); }
.drawer .n { position:absolute; top:4px; right:7px; font-size:12px; color:var(--ink2); font-variant-numeric:tabular-nums; }
.half { font-size:13px; margin:2px 0; min-height:16px; }
.half[data-h="front"] { border-top:1px solid var(--line); padding-top:3px; }   /* rear above the line, front below, like the drawer */
.half.gap { color:var(--bad2); font-weight:600; }
.whole { font-size:13px; margin:2px 0; }
.whole.gap { color:var(--bad2); font-weight:600; }
.pg { font-size:11px; color:var(--ink2); }
.ov { font-style:italic; color:var(--ink2); }
.ov::after { content:' (overflow)'; font-size:11px; }
h2 { font-size:15px; margin:18px 0 8px; font-weight:600; color:var(--ink2); }
.bins { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:6px; max-width:1400px; }
.bin { background:var(--have); border-radius:6px; padding:6px 8px 6px 8px; position:relative; box-shadow:inset 0 0 0 1px var(--line); min-height:40px; }
.bin .n { position:absolute; top:4px; right:7px; font-size:12px; color:#2f6db5; font-weight:600; }
.bin div { font-size:13px; margin:2px 0; padding-right:26px; }
@media (max-width:720px) { .grid { grid-template-columns:repeat(4, 1fr); } }
</style>
</head>
<body>
<header><h1>Fastener cabinet</h1><select id="pageSel"></select><span class="legend"><span><i style="background:var(--none)"></i>unassigned</span><span><i style="background:var(--have)"></i>assigned</span><span><i style="background:var(--bad);border-color:var(--bad2)"></i>lengths not contiguous</span></span></header>
<main><div class="grid" id="grid"></div><div id="binsWrap" hidden><h2>Bins (18 mm labels)</h2><div class="bins" id="bins"></div></div></main>
<script>
(async () => {
  const want = new URLSearchParams(location.search).get('page') || '';
  const { drawers, bins, pages, page } = await (await fetch('/api/cabinet?page=' + encodeURIComponent(want))).json();
  const sel = document.getElementById('pageSel');
  sel.innerHTML = pages.map(p => `<option value="${p.id}" ${p.id === page ? 'selected' : ''}>${p.title}</option>`).join('');
  if (!page) sel.innerHTML = '<option value="">(all pages)</option>' + sel.innerHTML;
  sel.onchange = () => location.search = '?page=' + encodeURIComponent(sel.value);
  document.title = (pages.find(p => p.id === page)?.title || 'Fastener') + ' cabinet';
  // 8 × 8 drawers, extended by whole rows of 8 when higher drawer numbers are in use
  const top = Math.max(0, ...Object.keys(drawers).map(Number).filter(n => n > 0));
  const N = Math.max(64, Math.ceil(top / 8) * 8), g = document.getElementById('grid');
  const txt = e => e.overflow ? `<span class="ov">${e.text}</span>` : e.text;
  const line = (e, cls, h) => `<div class="${cls}${e.gap ? ' gap' : ''}" ${h ? `data-h="${h}"` : ''}>${txt(e)}</div>`;
  for (let n = 1; n <= N; n++) {
    const d = drawers[String(n)], el = document.createElement('div');
    const gap = d && [...d.back, ...d.front, ...d.whole].some(e => e.gap);
    el.className = 'drawer' + (d ? ' have' : '') + (gap ? ' gap' : '');
    let html = `<span class="n">${n}</span>`;
    if (d) {
      if (d.whole.length) html += d.whole.map(e => line(e, 'whole')).join('');
      if (d.back.length || d.front.length) {
        html += `<div class="half${d.back.some(e => e.gap) ? ' gap' : ''}" data-h="rear">${d.back.map(txt).join('<br>') || '<span class="pg">empty</span>'}</div>`;
        html += `<div class="half${d.front.some(e => e.gap) ? ' gap' : ''}" data-h="front">${d.front.map(txt).join('<br>') || '<span class="pg">empty</span>'}</div>`;
      }
    }
    el.innerHTML = html; g.appendChild(el);
  }
  // bins: any number, in id order, each listing what it holds (overflow stock in italics)
  const ids = Object.keys(bins || {}).sort((a, b) => (parseInt(a.slice(1)) - parseInt(b.slice(1))) || a.localeCompare(b));
  if (ids.length) {
    document.getElementById('binsWrap').hidden = false;
    const bg = document.getElementById('bins');
    for (const id of ids) { const el = document.createElement('div'); el.className = 'bin'; el.innerHTML = `<span class="n">${id}</span>` + bins[id].map(e => `<div>${txt(e)}</div>`).join(''); bg.appendChild(el); }
  }
})();
</script>
</body>
</html>
